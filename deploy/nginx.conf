# ============================================================
# STARK — production edge (Nginx reverse proxy)
#
#   Flutter APK/AAB → HTTPS → Nginx → Go API → PostgreSQL/Redis/Workers
#
# TLS certs via certbot (Let's Encrypt) or your CA.
# Include from /etc/nginx/conf.d/stark.conf
# ============================================================

# Rate limits: auth is tight, purchases are moderate, reads are generous.
limit_req_zone $binary_remote_addr zone=stark_auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=stark_buy:10m     rate=30r/m;
limit_req_zone $binary_remote_addr zone=stark_default:10m rate=300r/m;

upstream stark_api {
    server api:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream stark_admin {
    server admin:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 443 ssl http2;
    server_name api.stark.example;

    ssl_certificate     /etc/letsencrypt/live/stark.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stark.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers — applied to every response.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    client_max_body_size 3m;   # profile photo cap (2 MB) + margin

    # Paystack webhooks: raw body, no buffering, signature verified in Go.
    location = /api/v1/payments/webhook/paystack {
        proxy_pass http://stark_api;
        proxy_request_buffering off;
        proxy_read_timeout 10s;
        limit_req zone=stark_default burst=20 nodelay;
    }

    # Authentication endpoints — strict limit against credential stuffing.
    location ~ ^/api/v1/auth/ {
        proxy_pass http://stark_api;
        limit_req zone=stark_auth burst=5 nodelay;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Financial actions — moderate limit; idempotency keys still guard dupes.
    location ~ ^/api/v1/(wallet|transactions|airtime|data|cable|electricity) {
        proxy_pass http://stark_api;
        limit_req zone=stark_buy burst=10 nodelay;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://stark_api;
        limit_req zone=stark_default burst=50 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Postgres, Redis, provider keys are NEVER exposed through this edge.
    location ~ ^/(db|redis|internal) { deny all; }
}

# Admin console — office-IP allowlist recommended in production.
server {
    listen 443 ssl http2;
    server_name admin.stark.example;

    ssl_certificate     /etc/letsencrypt/live/stark.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stark.example/privkey.pem;

    location / {
        proxy_pass http://stark_admin;
        proxy_set_header Host $host;
    }
}
