# ============================================================
# STARK TELECOMMUNICATION — Flutter application (FINAL STACK)
# Flutter 3.x · Dart 3.x · Material 3 · Android-first, iOS-ready
#
#   State        → Riverpod
#   Navigation   → GoRouter
#   HTTP         → Dio (REST + JSON)
#   Models       → Freezed + json_serializable
#   Secure store → flutter_secure_storage (tokens ONLY here)
#   Local DB     → Drift + SQLite (offline-safe cache, no balances)
#   Biometrics   → local_auth (fingerprint / face / passcode)
#   Photo        → image_picker + camera + image_cropper
#   Push         → Firebase Cloud Messaging
#   Monitoring   → Sentry
# ============================================================
name: stark_telecom
description: STARK Telecommunication — Nigerian VTU, fintech wallet and digital services platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — Clean Architecture + feature-first + DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Models — immutable, JSON (de)serialization via build_runner
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Secure storage & lightweight preferences
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Local structured database — offline cache for SAFE data only.
  # Wallet balances are NEVER cached; they come from the ledger.
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Biometrics — data never leaves the device; only success/failure
  local_auth: ^2.2.0

  # Profile photo + QR (permissions requested at point of use)
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  image_cropper: ^7.0.5
  mobile_scanner: ^5.1.1

  # WhatsApp Help Center — opens the support chat externally.
  # The user always reviews the prepared message and taps Send.
  url_launcher: ^6.3.0

  # Device, connectivity, permissions
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1

  # Firebase Cloud Messaging + local notifications
  firebase_core: ^3.2.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.1

  # Monitoring & formatting & utilities
  sentry_flutter: ^8.4.0
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.1
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
