name: stark_telecom
description: STARK Telecommunication — Nigerian VTU, fintech wallet and digital services platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Secure storage & preferences
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Biometrics (data never leaves the device)
  local_auth: ^2.2.0

  # Camera / gallery for profile photo & QR
  image_picker: ^1.1.2
  mobile_scanner: ^5.1.1

  # Device, connectivity, permissions (requested only at point of use)
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1

  # Firebase Cloud Messaging
  firebase_core: ^3.2.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.1

  # Formatting & utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
